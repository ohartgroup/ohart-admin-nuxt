# OHART G5 Quality Gate — typecheck / lint / stylelint / test+coverage / SonarQube
# Ref: 260723_quality-testing_governance.md §3.2

name: ci

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action은 private repo에서 라이선스가 필요해서,
      # 대신 OSS CLI 바이너리를 직접 받아 무료로 돌린다(G4 보안 거버넌스 3.1).
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --redact

  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # SonarQube / diff coverage 분석에 전체 히스토리 필요
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx nuxi typecheck

      - name: Lint
        run: bun run lint

      - name: Stylelint
        run: bun run stylelint

      - name: Test with coverage
        run: bun run test -- --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      # SONAR_TOKEN 이 GitHub Actions Secrets에 있을 때만 실행 (G4 시크릿 규칙)
      - name: SonarQube Cloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
